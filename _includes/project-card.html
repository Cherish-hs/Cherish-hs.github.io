<article class="ch-card ch-project-card">
  <a class="ch-project-cover" href="{{ project.url | relative_url }}" aria-label="了解项目：{{ project.title | escape }}">
    {% if project.cover %}
    <img src="{{ project.cover | relative_url }}" alt="{{ project.cover_alt | default: project.title | escape }}" loading="lazy">
    {% else %}<span class="ch-project-placeholder" aria-hidden="true">&lt;/&gt;</span>{% endif %}
  </a>
  <div class="ch-project-body">
    <p class="ch-eyebrow">{{ project.field | default: 'PROJECT' | escape }}</p>
    <h3><a href="{{ project.url | relative_url }}">{{ project.title | escape }}</a></h3>
    <p class="ch-project-desc">{{ project.description | escape }}</p>
    <div class="ch-tags">{% for tag in project.tags %}<span>{{ tag | escape }}</span>{% endfor %}</div>
    <a class="ch-card-link" href="{{ project.url | relative_url }}">了解项目 →</a>
  </div>
</article>

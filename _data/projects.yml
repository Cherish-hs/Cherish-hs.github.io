# ===== 首页「精选项目」配置 =====
# 以后新增项目：复制一个 "- " 开头的块，改掉内容即可，保存后首页自动显示（按这里写的顺序排列）。
#
# 各字段说明：
#   title  ：项目名称（必填）
#   url    ：项目地址（必填）——填具体仓库地址，点卡片会直接进入该仓库
#   desc   ：一句话介绍（选填）
#   cover  ：封面图（选填）——填仓库里的图片路径，如 /assets/images/projects/xxx.png
#            不填则自动显示「渐变底色 + 图标」的封面
#   icon   ：没填 cover 时显示在封面上的图标（选填，默认 📁）
#   accent ：没填 cover 时的渐变配色，可选 teal / blue / indigo / slate / dark（选填）
#   tags   ：标签（选填）


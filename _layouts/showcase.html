<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/homepage.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2314b8a6'/><text x='50' y='66' font-size='46' font-family='monospace' font-weight='bold' fill='white' text-anchor='middle'>&lt;/&gt;</text></svg>">
  <script>
    // 首屏前读取主题（首页默认浅色，与全站共用同一个存储键）
    (function () {
      try {
        var t = localStorage.getItem('blog-theme');
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
</head>
<body class="ch-body">
<div class="ch-home" id="top">
  {% include site-nav.html %}
  {{ content }}
  {% include site-footer.html %}
</div>
<script id="chSearchData" type="application/json">[
{%- for post in site.posts -%}
{"t": {{ post.title | jsonify | replace: '<', '\u003c' }}, "u": {{ post.url | relative_url | jsonify }} }{% unless forloop.last %},{% endunless %}
{%- endfor -%}
]</script>
<script src="{{ '/assets/js/homepage.js' | relative_url }}" defer></script>
</body>
</html>

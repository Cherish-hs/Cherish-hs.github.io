<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128221;</text></svg>">
  <script>
    // 首屏前读取主题，避免闪烁
    (function () {
      try {
        var t = localStorage.getItem('blog-theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- ===== 动态背景层（不响应鼠标，不遮挡内容） ===== -->
  <div class="bg-layer" aria-hidden="true">
    <div class="aurora aurora-1"></div>
    <div class="aurora aurora-2"></div>
    <div class="aurora aurora-3"></div>
    <canvas id="bg-canvas"></canvas>
  </div>

  <!-- ===== 阅读进度条 ===== -->
  <div id="progress-bar" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="{{ '/' | relative_url }}">
        <span class="logo-dot"></span>{{ site.title }}
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">首页</a>
        <a href="{{ '/about/' | relative_url }}">关于</a>
        <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a>
        <button id="theme-toggle" aria-label="切换明暗主题" title="切换主题">
          <span class="icon-sun">☀️</span>
          <span class="icon-moon">🌙</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <!-- ===== 回到顶部 ===== -->
  <button id="back-to-top" aria-label="回到顶部" title="回到顶部">↑</button>

  <footer class="site-footer">
    <div class="container footer-glass">
      <p>
        &copy; {{ site.time | date: '%Y' }} {{ site.author.name }}
        {% if site.author.email %} · <a href="mailto:{{ site.author.email }}">Email</a>{% endif %}
        · <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a>
      </p>
      <p class="footer-power">由 <a href="https://jekyllrb.com/" target="_blank" rel="noopener">Jekyll</a> 构建 · 托管于 <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a></p>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
